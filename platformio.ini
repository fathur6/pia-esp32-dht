[platformio]
default_envs = dht12
src_dir = .

[env]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
upload_speed = 460800
monitor_speed = 115200

[env:dht12]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
build_src_filter = -<*> +<src/main.cpp>

[env:blink]
build_src_filter = -<*> +<examples/blink/main.cpp>

[env:forward]
build_src_filter = -<*> +<examples/forward/main.cpp>

[env:pingpong200]
build_src_filter = -<*> +<examples/pingpong200/main.cpp>

[env:pingpong100]
build_src_filter = -<*> +<examples/pingpong100/main.cpp>

[env:diag]
build_src_filter = -<*> +<examples/diag/main.cpp>
